<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="20" width="1000" height="60" rx="8" fill="url(#headerGrad)"/>
  <text x="525" y="45" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">ENTITY-RELATIONSHIP (ER) DIAGRAM - SCENARIO 14</text>
  <text x="525" y="66" text-anchor="middle" fill="#93c5fd" font-size="13">Electricity Consumption Management &amp; Energy Usage Analysis | Student: Kanishka K (732925ITR045)</text>

  <!-- ENTITY 1: TARIFF_PLANS -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="230" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 252 0 Q 260 0 260 8 L 260 38 L 0 38 Z" fill="#2563eb"/>
    <text x="130" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">TARIFF_PLANS</text>
    
    <text x="15" y="60" font-size="12" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="60" font-size="12" fill="#1e293b">tariff_id : INT</text>

    <text x="15" y="82" font-size="12" font-weight="bold" fill="#0284c7">UK</text>
    <text x="45" y="82" font-size="12" fill="#1e293b">connection_type : VARCHAR</text>

    <text x="45" y="104" font-size="12" fill="#475569">fixed_charge : DECIMAL</text>
    <text x="45" y="126" font-size="12" fill="#475569">rate_slab_1 (0-100) : DECIMAL</text>
    <text x="45" y="148" font-size="12" fill="#475569">rate_slab_2 (101-200) : DECIMAL</text>
    <text x="45" y="170" font-size="12" fill="#475569">rate_slab_3 (201-400) : DECIMAL</text>
    <text x="45" y="192" font-size="12" fill="#475569">rate_slab_above : DECIMAL</text>
    <text x="45" y="214" font-size="12" fill="#475569">tax_percentage : DECIMAL</text>
  </g>

  <!-- ENTITY 2: CONSUMERS -->
  <g transform="translate(390, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="300" rx="8" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="#1e3a8a"/>
    <text x="140" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">CONSUMERS</text>
    
    <text x="15" y="60" font-size="12" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="60" font-size="12" fill="#1e293b">consumer_id : INT</text>

    <text x="15" y="82" font-size="12" font-weight="bold" fill="#0284c7">UK</text>
    <text x="45" y="82" font-size="12" fill="#1e293b">consumer_number : VARCHAR</text>

    <text x="45" y="104" font-size="12" fill="#475569">name : VARCHAR(100)</text>
    <text x="45" y="126" font-size="12" fill="#475569">email : VARCHAR(100)</text>
    <text x="45" y="148" font-size="12" fill="#475569">phone : VARCHAR(15)</text>
    <text x="45" y="170" font-size="12" fill="#475569">address : VARCHAR(255)</text>
    <text x="45" y="192" font-size="12" fill="#475569">city : VARCHAR(50)</text>

    <text x="15" y="214" font-size="12" font-weight="bold" fill="#16a34a">FK</text>
    <text x="45" y="214" font-size="12" fill="#1e293b">connection_type : VARCHAR</text>

    <text x="15" y="236" font-size="12" font-weight="bold" fill="#0284c7">UK</text>
    <text x="45" y="236" font-size="12" fill="#1e293b">meter_number : VARCHAR</text>

    <text x="45" y="258" font-size="12" fill="#475569">sanctioned_load_kw : DECIMAL</text>
    <text x="45" y="280" font-size="12" fill="#475569">status : VARCHAR(15)</text>
  </g>

  <!-- ENTITY 3: METER_READINGS -->
  <g transform="translate(740, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="240" rx="8" fill="#f8fafc" stroke="#0891b2" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="#0891b2"/>
    <text x="135" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">METER_READINGS</text>
    
    <text x="15" y="60" font-size="12" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="60" font-size="12" fill="#1e293b">reading_id : INT</text>

    <text x="15" y="82" font-size="12" font-weight="bold" fill="#16a34a">FK</text>
    <text x="45" y="82" font-size="12" fill="#1e293b">consumer_id : INT</text>

    <text x="45" y="104" font-size="12" fill="#475569">billing_month : VARCHAR(7)</text>
    <text x="45" y="126" font-size="12" fill="#475569">reading_date : DATE</text>
    <text x="45" y="148" font-size="12" fill="#475569">previous_reading : DECIMAL</text>
    <text x="45" y="170" font-size="12" fill="#475569">current_reading : DECIMAL</text>
    
    <text x="15" y="194" font-size="11" font-weight="bold" fill="#8b5cf6">CALC</text>
    <text x="45" y="194" font-size="12" font-weight="bold" fill="#1e293b">units_consumed : DECIMAL</text>

    <text x="45" y="218" font-size="12" fill="#475569">meter_reader_name : VARCHAR</text>
  </g>

  <!-- ENTITY 4: BILLS -->
  <g transform="translate(560, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="230" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="#16a34a"/>
    <text x="140" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">BILLS</text>
    
    <text x="15" y="60" font-size="12" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="60" font-size="12" fill="#1e293b">bill_id : INT</text>

    <text x="15" y="82" font-size="12" font-weight="bold" fill="#0284c7">UK</text>
    <text x="45" y="82" font-size="12" fill="#1e293b">bill_number : VARCHAR</text>

    <text x="15" y="104" font-size="12" font-weight="bold" fill="#16a34a">FK</text>
    <text x="45" y="104" font-size="12" fill="#1e293b">reading_id : INT (UK)</text>

    <text x="15" y="126" font-size="12" font-weight="bold" fill="#16a34a">FK</text>
    <text x="45" y="126" font-size="12" fill="#1e293b">consumer_id : INT</text>

    <text x="45" y="148" font-size="12" fill="#475569">energy_charges : DECIMAL</text>
    <text x="45" y="170" font-size="12" fill="#475569">fixed_charges : DECIMAL</text>
    <text x="45" y="192" font-size="12" fill="#475569">tax_amount : DECIMAL</text>

    <text x="15" y="214" font-size="12" font-weight="bold" fill="#1e3a8a">TOT</text>
    <text x="45" y="214" font-size="12" font-weight="bold" fill="#1e293b">total_bill_amount : DECIMAL</text>
  </g>

  <!-- ENTITY 5: AUDIT_LOGS -->
  <g transform="translate(180, 460)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="150" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 38 L 0 38 Z" fill="#64748b"/>
    <text x="120" y="25" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">AUDIT_LOGS</text>
    
    <text x="15" y="60" font-size="12" font-weight="bold" fill="#dc2626">PK</text>
    <text x="45" y="60" font-size="12" fill="#1e293b">log_id : INT</text>
    <text x="45" y="82" font-size="12" fill="#475569">action_type : VARCHAR</text>
    <text x="45" y="104" font-size="12" fill="#475569">consumer_id : INT</text>
    <text x="45" y="126" font-size="12" fill="#475569">log_timestamp : TIMESTAMP</text>
  </g>

  <!-- RELATIONSHIP LINES & DIAMONDS -->
  <!-- 1. TARIFF_PLANS to CONSUMERS (1:N) -->
  <line x1="300" y1="200" x2="390" y2="200" stroke="#1e293b" stroke-width="2"/>
  <text x="310" y="190" font-size="11" font-weight="bold" fill="#2563eb">1</text>
  <text x="375" y="190" font-size="11" font-weight="bold" fill="#2563eb">N</text>

  <!-- 2. CONSUMERS to METER_READINGS (1:N) -->
  <line x1="670" y1="200" x2="740" y2="200" stroke="#1e293b" stroke-width="2"/>
  <text x="680" y="190" font-size="11" font-weight="bold" fill="#0891b2">1</text>
  <text x="725" y="190" font-size="11" font-weight="bold" fill="#0891b2">N</text>

  <!-- 3. METER_READINGS to BILLS (1:1) -->
  <path d="M 875 350 L 875 510 L 840 510" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="880" y="370" font-size="11" font-weight="bold" fill="#16a34a">1</text>
  <text x="845" y="500" font-size="11" font-weight="bold" fill="#16a34a">1</text>

  <!-- 4. CONSUMERS to BILLS (1:N) -->
  <path d="M 530 410 L 530 520 L 560 520" fill="none" stroke="#1e293b" stroke-dasharray="4" stroke-width="1.5"/>

  <!-- 5. CONSUMERS to AUDIT_LOGS (1:N) -->
  <path d="M 440 410 L 440 500 L 420 500" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="425" y="490" font-size="11" font-weight="bold" fill="#64748b">N</text>

</svg>
